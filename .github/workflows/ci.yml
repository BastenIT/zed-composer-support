name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the WebAssembly target
        run: rustup target add wasm32-wasip2
      - name: Check JavaScript
        run: npm run check
      - name: Check formatting
        run: cargo fmt --check
      - name: Check the extension
        run: cargo check --locked --target wasm32-wasip2
      - name: Check version fields
        shell: bash
        run: node scripts/check-version.js "$(node -p 'require("./package.json").version')"
