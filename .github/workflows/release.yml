name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the tag
        shell: bash
        run: |
          server_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' server/Cargo.toml | head -1)"
          if [[ "$GITHUB_REF_NAME" != "v$server_version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match server version $server_version" >&2
            exit 1
          fi
      - name: Install the WebAssembly target
        run: rustup target add wasm32-wasip2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test the language server
        run: cargo test --locked -p composer-language-server
      - name: Lint the language server
        run: cargo clippy --locked -p composer-language-server --all-targets -- -D warnings
      - name: Check the extension
        run: cargo check --locked -p zed_composer_support --target wasm32-wasip2
      - name: Install stable Neovim
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz" \
            --output "$RUNNER_TEMP/neovim.tar.gz"
          mkdir "$RUNNER_TEMP/neovim"
          tar --extract --gzip --file "$RUNNER_TEMP/neovim.tar.gz" \
            --directory "$RUNNER_TEMP/neovim" --strip-components=1
      - name: Build the language server for Neovim
        run: cargo build --locked -p composer-language-server
      - name: Test the Neovim integration
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/nvim-cache
          XDG_DATA_HOME: ${{ runner.temp }}/nvim-data
          XDG_STATE_HOME: ${{ runner.temp }}/nvim-state
        run: |
          "$RUNNER_TEMP/neovim/bin/nvim" --headless -u NONE -l scripts/check-neovim.lua
          "$RUNNER_TEMP/neovim/bin/nvim" --headless -u NONE -l scripts/check-neovim-lsp.lua

  create-release:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag
          fi

  build-server:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        # The runner is only the build machine. The Rust target and asset name
        # define the systems on which the resulting executable runs.
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: composer-language-server-x86_64-unknown-linux-musl
            executable: composer-language-server
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            asset: composer-language-server-aarch64-unknown-linux-musl
            executable: composer-language-server
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: composer-language-server-x86_64-apple-darwin
            executable: composer-language-server
            macos_deployment_target: "10.15"
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: composer-language-server-aarch64-apple-darwin
            executable: composer-language-server
            macos_deployment_target: "11.0"
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: composer-language-server-x86_64-pc-windows-msvc.exe
            executable: composer-language-server.exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: composer-language-server-aarch64-pc-windows-msvc.exe
            executable: composer-language-server.exe
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install the musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build the self-contained Linux language server
        if: runner.os == 'Linux'
        env:
          CC: musl-gcc
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release -p composer-language-server --target ${{ matrix.target }}
      - name: Build the macOS language server
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: cargo build --locked --release -p composer-language-server --target ${{ matrix.target }}
      - name: Build the Windows language server
        if: runner.os == 'Windows'
        run: cargo build --locked --release -p composer-language-server --target ${{ matrix.target }}
      - name: Verify the Linux binary is self-contained
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          if readelf -l "$binary" | grep -q 'Requesting program interpreter'; then
            echo "$binary unexpectedly requires a dynamic loader" >&2
            exit 1
          fi
          if readelf -d "$binary" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "$binary unexpectedly depends on shared libraries" >&2
            exit 1
          fi
      - name: Upload the release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "${{ matrix.asset }}"
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber

  publish-release:
    needs: build-server
    runs-on: ubuntu-latest

    steps:
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
